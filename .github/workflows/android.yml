name: Construire et publier l’APK Flutter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Dépendances et tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Préparer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Clé de signature manquante'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/epinal.p12"
      - name: Compiler l’APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/epinal.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name="1.0.${GITHUB_RUN_NUMBER}" --build-number="$GITHUB_RUN_NUMBER"
      - name: Vérifier la signature et publier l’artefact
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk Epinal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Epinal-APK-signe
          path: Epinal.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publier la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${GITHUB_RUN_NUMBER}" Epinal.apk --title "Épinal 1.0.${GITHUB_RUN_NUMBER}" --notes "APK Android signé. Installez-le par-dessus votre version existante." --latest
