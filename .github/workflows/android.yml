name: Construire et publier l’APK Flutter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Dépendances et tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
          node test/epub_theme_test.js
      - name: Préparer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Clé de signature manquante'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/epinal.p12"
      - name: Compiler l’APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/epinal.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name="1.0.${GITHUB_RUN_NUMBER}" --build-number="$GITHUB_RUN_NUMBER"
      - name: Vérifier la signature et publier l’artefact
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$TOOLS/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "$RUNNER_TEMP/signature.txt"
          grep -Fi 'certificate SHA-256 digest: c355bc8339c2ebaf14b0ac811f489c709a60355acbb2c82f937bf4fe219743a9' "$RUNNER_TEMP/signature.txt"
          "$TOOLS/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "package: name='com.epinal.reader' versionCode='${GITHUB_RUN_NUMBER}'"
          cp build/app/outputs/flutter-apk/app-release.apk Epinal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Epinal-APK-signe
          path: Epinal.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publier la version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.0.${GITHUB_RUN_NUMBER}" Epinal.apk --title "Épinal 1.0.${GITHUB_RUN_NUMBER}" --notes "APK Android signé. Installez-le par-dessus votre version existante." --latest
  windows:
    # Android remains independently publishable even if the Windows build fails.
    # Wait for its release, then add the Windows archive to the same tag.
    needs: android
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: NuGet/setup-nuget@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Préparer les dépendances
        run: flutter pub get
      - name: Vérifier le lecteur WebView2 sur Windows
        shell: pwsh
        run: |
          # Flutter's Windows test harness can report a missing listener folder
          # during teardown even after the integration test reports success.
          flutter test integration_test/windows_reader_test.dart -d windows 2>&1 | Tee-Object -FilePath windows-test.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $log = Get-Content windows-test.log -Raw
            $passed = $log -match 'Windows : un EPUB charge et le lecteur devient opérationnel' -and $log -match 'Passing tests'
            $teardown = $log -match 'No tests were found' -and $log -match 'PathNotFoundException: Deletion failed' -and $log -match 'flutter_test_listener'
            $realFailure = $log -match 'Test failed\.|EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK|[0-9]+ tests? failed'
            if ($passed -and $teardown -and !$realFailure) {
              Write-Warning 'Le test EPUB a réussi, mais Flutter a échoué à nettoyer son dossier temporaire de test Windows.'
              $global:LASTEXITCODE = 0
            } else { exit $testExit }
          }
      - name: Compiler Épinal Windows
        shell: pwsh
        run: flutter build windows --release --build-name="1.0.$env:GITHUB_RUN_NUMBER" --build-number="$env:GITHUB_RUN_NUMBER"
      - name: Créer l’archive Windows
        shell: pwsh
        run: |
          $directory = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$directory/Epinal.exe")) { throw 'Exécutable Windows absent' }
          if (!(Test-Path "$directory/flutter_windows.dll")) { throw 'Moteur Flutter absent' }
          if (!(Test-Path "$directory/data/flutter_assets")) { throw 'Ressources Flutter absentes' }
          Compress-Archive -Path "$directory/*" -DestinationPath 'Epinal-Windows-x64.zip' -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Epinal-Windows-x64
          path: Epinal-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Ajouter Windows à la publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v1.0.$env:GITHUB_RUN_NUMBER" Epinal-Windows-x64.zip --clobber
