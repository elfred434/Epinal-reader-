name: Validation du correctif WebView2 Windows
on:
  push:
    branches: [windows-webview-crash-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: NuGet/setup-nuget@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Test de non-régression Windows
        timeout-minutes: 8
        shell: pwsh
        run: |
          flutter test integration_test/windows_bridge_regression_test.dart -d windows 2>&1 | Tee-Object -FilePath bridge-test.log
          $exit = $LASTEXITCODE
          $log = Get-Content bridge-test.log -Raw
          $success = $log -match 'EPINAL_NULL_REPLY_OK' -and $log -match 'Passing tests'
          $bad = $log -match 'Test failed\.|EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK|[0-9]+ tests? failed|Lost connection to device'
          if (!$success -or $bad) { throw 'Test du pont JavaScript échoué ou non confirmé.' }
          if ($exit -ne 0) {
            $cleanup = $log -match 'No tests were found' -and $log -match '0 tests passed'
            if (!$cleanup) { exit $exit }
            Write-Warning 'Le test a réussi, Flutter a ensuite échoué au nettoyage du dossier temporaire.'
            $global:LASTEXITCODE = 0
          }
      - name: Construire Windows en mode release
        run: flutter build windows --release --build-name=1.0.28 --build-number=28
      - name: Construire l’installateur de test
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.28 installer/epinal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./installer/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Epinal-Windows-webview-fix
          path: Epinal-Setup-x64.exe
          retention-days: 14
