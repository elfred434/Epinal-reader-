name: epinal_reader
description: Bibliothèque et lecteur EPUB hors ligne.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_epub_viewer: 2.2.1
  epubx: 4.0.0
  image: ^3.3.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  http: ^1.4.0
  package_info_plus: ^8.3.0
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
