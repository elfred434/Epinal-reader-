name: Vérifier Android sans publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Analyse et tests Android
        run: |
          flutter pub get
          flutter analyze
          flutter test
          node test/epub_theme_test.js
