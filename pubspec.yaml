name: epinal_reader
description: Bibliothèque et lecteur EPUB hors ligne.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_epub_viewer:
    path: third_party/flutter_epub_viewer
  epubx: 4.0.0
  archive: 3.6.1
  xml: ^6.6.1
  path: ^1.9.1
  image: ^3.3.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  http: ^1.4.0
  package_info_plus: ^8.3.0
  flutter_tts: ^4.2.3

# Windows-only fork of 0.7.0-beta.3: avoids dereferencing a null JS reply.
# Android and other platform implementations remain the published packages.
dependency_overrides:
  flutter_inappwebview_windows:
    path: third_party/flutter_inappwebview_windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
